name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY || secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST || secrets.PUBLIC_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        run: npm run build

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}" > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p "$HOSTINGER_PORT" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH authentication
        run: |
          ssh \
            -i ~/.ssh/hostinger \
            -p "$HOSTINGER_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "pwd"

      - name: Deploy static files
        run: |
          rsync -az --delete \
            --exclude='/pane/***' \
            --exclude='/latte/***' \
            -e "ssh -i ~/.ssh/hostinger -p $HOSTINGER_PORT -o BatchMode=yes -o IdentitiesOnly=yes" \
            dist/ \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_TARGET_DIR }}/"
